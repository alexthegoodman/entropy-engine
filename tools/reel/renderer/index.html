<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Entropy DAW Reel</title>
<!-- Served from the repository root by capture.mjs: the reel's own files, the engine's Figtree, and
     the exporter's output in tools/reel/out/. -->
<style>
  @font-face { font-family: "Figtree"; src: url("/src/fonts/figtree/Figtree%5Bwght%5D.ttf") format("truetype"); font-weight: 300 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-latin.woff2") format("woff2"); font-weight: 100 800; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-latinext.woff2") format("woff2"); font-weight: 100 800; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-greek.woff2") format("woff2"); font-weight: 100 800; unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #out { display: block; width: 1920px; height: 1080px; }
  #scene { display: none; }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<canvas id="scene" width="1920" height="1080"></canvas>
<canvas id="overlay" width="1920" height="1080" style="display:none"></canvas>
<script src="lib.js"></script>
<script src="data.js"></script>
<script src="instruments.js"></script>
<script src="post.js"></script>
<script src="scenes.js"></script>
<script>
(async () => {
  // Every face the reel sets, loaded before the first frame.
  const faces = ['200', '300', '400', '700', '800', '900'].map((w) => `${w} 40px "Figtree"`).concat(['400 16px "JetBrains Mono"', '500 16px "JetBrains Mono"', '700 16px "JetBrains Mono"']);
  await Promise.all(faces.map((f) => document.fonts.load(f, 'AÁ♭♯—·’ωρ″′₀√')));
  await document.fonts.ready;
  await loadData();
  Post.init(document.getElementById('out'));
  const ctx = document.getElementById('scene').getContext('2d', { alpha: false });
  const ov = document.getElementById('overlay').getContext('2d', { alpha: true });
  window.renderFrame = (f) => {
    const post = renderScene(ctx, ov, f / FPS, f);
    Post.render(document.getElementById('scene'), document.getElementById('overlay'), post);
    return true;
  };
  window.reelReady = true;
})().catch((e) => { window.reelError = String(e && e.stack || e); });
</script>
</body>
</html>
