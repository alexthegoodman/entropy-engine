[package]
name = "entropy-cad"
version = "0.1.0"
edition = "2021"
description = "Geometry kernel shared by Entropy's CAD apps: NURBS curves, sketches, swept bodies, deformers and booleans"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The kernel is the hot path of every drag in a CAD app, and its tests sweep real geometry.
[profile.dev]
opt-level = 2
