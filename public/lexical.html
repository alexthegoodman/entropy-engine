<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lexical Editor</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #1e1e1e; color: #d4d4d4; }
        #editor-container { width: 100%; height: 100vh; overflow: auto; }
        .editor-input {
            width: 100%;
            min-height: 100%;
            padding: 20px;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
            line-height: 1.5;
        }
        [contenteditable]:empty:before {
            content: "Start writing...";
            color: #888;
        }
    </style>
</head>
<body>
    <div id="editor-container">
        <div id="lexical-editor" class="editor-input" contenteditable="true"></div>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Lexical Editor Loaded');
        });

        function setMarkdown(markdown) {
            document.getElementById('lexical-editor').innerText = markdown;
        }

        document.getElementById('lexical-editor').addEventListener('input', () => {
            const text = document.getElementById('lexical-editor').innerText;
            if (window.ipc) {
                window.ipc.postMessage(JSON.stringify({ type: 'markdown_update', data: text }));
            }
        });
    </script>
</body>
</html>
