<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RTE Editor</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #1e1e1e; color: #d4d4d4; }
        #editor-container { width: 100%; height: 100vh; overflow: auto; }
        .editor-input {
            width: 100%;
            min-height: 100%;
            padding: 20px;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="editor-container">
        <div id="tiptap-editor" class="editor-input" contenteditable="true"></div>
    </div>
    <script type="module">
        import { Editor } from 'https://esm.sh/@tiptap/core'
        import StarterKit from 'https://esm.sh/@tiptap/starter-kit'

        new Editor({
            element: document.querySelector('#tiptap-editor'),
            extensions: [StarterKit],
            content: '<p>Start writing...</p>',
        })
    </script>
</body>
</html>
