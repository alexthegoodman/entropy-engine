[package]
name = "entropy-engine"
version = "0.1.0"
edition = "2024"

[patch.crates-io]
vst3-host = { path = "vendor/vst3-host" }

[[bin]]
name = "game"
path = "src/bin/game.rs"

[[test]]
name = "browser_bdd"
harness = false

[[test]]
name = "track_view_bdd"
harness = false

[[test]]
name = "vst3_bdd"
harness = false

[[test]]
name = "audio_analysis_bdd"
harness = false

[[test]]
name = "audio_widgets_bdd"
harness = false

[dependencies]
# For dependencies that use getrandom 0.2
getrandom_v2 = { package = "getrandom", version = "0.2", features = ["js"] }

# For dependencies that use getrandom 0.3
getrandom = { version = "0.3", features = ["wasm_js"] }

env_logger = "0.11"
pollster = "0.3"
bytemuck = { version = "1.19.0", features = ["derive"] }
# wgpu = "22.1.0"
# wgpu = "0.19"
wgpu = "27.0.1"
futures = "0.3.30"
uuid = { version = "1.8.0", features = ["v4", "v5", "js"] }
lyon_tessellation = "1.0.15"
strum = "0.26.3"
strum_macros = "0.26"
cgmath = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3.11.0"
fontdue = "0.9.2"
image = "0.25.5"
rand = "0.8.5"
munkres = "0.5.2"
directories = "5.0.1"
chrono = { version = "0.4.38", features = ["serde", "wasmbind"] }
anyhow = "1.0"
# wgpu = "22.1.0"
raw-window-handle = "0.6.2"
nalgebra = { version = "0.32.5", features = ["mint"] }
nalgebra-glm = "0.18.0"
base64 = "0.22.1"
tiff = "0.9.1"
reqwest = { version = "0.12.4", features = ["json", "blocking"] }
reqwest-graphql = "1.0.0"
regex = "1"
# Parses tests/features/browser_live.feature at runtime so BrowserBddDriver's live-tier action
# sequence (src/startup.rs) is generated from that file instead of duplicated by hand. Same
# gherkin version cucumber = "0.23.0" (a dev-dependency below) already pulls in transitively.
gherkin = "0.16"
gloo-utils = "0.2.0"
rapier3d = { version = "0.20.0" }
lazy_static = "1.5.0"
# rayon = "1.10.0" # no wasm?
cursor-icon = "1.2.0"
tracing = "0.1.43"
noise = "0.8"
transform-gizmo = "0.8.0"
mint = "0.5.9"
exr = "1.74.0"
gilrs = "0.11.1"
rodio = "0.21.1"
fundsp = "0.23.0"
# Windowed real FFT for the DAW's spectrum analyzer (src/audio/analysis.rs). Already in the tree
# via fundsp; naming it here lets the analyzer plan its own transforms.
realfft = "3.5"
hound = "3.5"
ordered-float = "5.1.0"
burn = { version = "0.20", features = ["ndarray", "autodiff"] }
fastrand = "2"

# entropy_gui (the in-house immediate-mode GUI kit that replaces egui) dependencies
etagere = "0.2"
arboard = "3"

# Minimal blocking HTTP server backing the automatic MCP server (src/mcp/) that
# exposes every addon-registered tool to external MCP clients like Claude Code.
tiny_http = "0.12"
scraper = "0.27.0"
ego-tree = "0.11.0"
taffy = "0.14.0"
url = "2.5.8"

[dependencies.gltf]
features = ["utils", "KHR_texture_transform"]
version = "1"

[target.'cfg(target_os = "windows")'.dependencies]
wry = "0.50"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Media_MediaFoundation",
    "Win32_System",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_Pointer",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Com_Urlmon",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
] }
windows-core = "0.58.0"
windows-capture = "1.5.0"
meshopt = "0.4.1"
winit = { version = "0.30.12", features = ["rwh_06"] }
# egui / egui-wgpu / egui-winit / egui_dock / egui-snarl / egui_code_editor all removed:
# replaced by our own entropy_gui kit (see src/entropy_gui/).
device_query = "2.1.0"
tokio = { version = "1.41.0", features = ["fs", "full"] }
deno_core = "0.332.0"
deno_error = "0.5.5"
# deno_core = "0.382.0"
# deno_error = "0.7.3"
rfd = "0.17.2"
# Hosts real VST3 plugins (src/audio/vst3.rs). default-features off: no cpal backend (rodio owns
# our audio output) and no process-isolation helper binary. Its own directory scan misses the
# single-file .vst3 layout Windows installers use, so scanning is done in src/audio/vst3.rs.
vst3-host = { version = "0.9.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator", "Location"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-timer = "0.2.5"
js-sys = "0.3.83"

[dev-dependencies]
# Native Gherkin runner for black-box behavior scenarios. The test binary, rather than libtest,
# owns execution so readable feature output and screenshot hooks stay available in CI.
cucumber = "0.23.0"
